# Local stack. The database password is the same placeholder as .env.example.
# Do not use it on a machine other people can reach. Pass real keys from the
# shell environment. They are not written into the images.
#
# The Postgres and Qdrant ports are published for local inspection. On a
# shared host, remove those two "ports" entries so only the API and the desk
# are reachable. This file has not been run against a Docker daemon in this
# repository's release checks.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prooflens
      POSTGRES_PASSWORD: prooflens
      POSTGRES_DB: prooflens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prooflens -d prooflens"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  qdrant:
    # The client in backend/requirements.txt is 1.20. Its compatibility check
    # accepts a server within one minor version.
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6333:6333"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://prooflens:prooflens@postgres:5432/prooflens
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_PROVIDER: tavily
    volumes:
      - embedding_cache:/home/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  qdrant_data:
  embedding_cache:
